<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111d30"><title>LoL TOP / JG ピックアドバイザー</title><style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0b1220;color:#eaf0fa;font:15px/1.5 system-ui,-apple-system,'Noto Sans JP',sans-serif}header{background:#111d30;border-bottom:1px solid #344861;position:sticky;top:0;z-index:2}main,.head{max-width:1040px;margin:auto;padding:12px 14px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:1.15rem;margin:0}button,select,input{font:inherit;border:1px solid #40536e;border-radius:10px;background:#101c30;color:#fff;padding:10px}button{cursor:pointer}.tabs{display:flex;gap:7px}.tabs button.active{background:#155d68;border-color:#64d9c4;font-weight:700}.subtabs{margin:4px 0 12px;display:flex;gap:8px}.subtabs button.active{border-color:#64d9c4;color:#8af5db}.panel{background:#172236;border:1px solid #30405a;border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:#a9b9d0;font-size:.88rem}h2{font-size:1.1rem;margin:0 0 12px}label{display:block;margin:10px 0 4px;color:#a9b9d0}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input{width:100%}.advice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.advice-grid article{background:#0e1b2e;border:1px solid #344861;padding:14px;border-radius:12px}.advice-grid span{display:block;color:#9bacc5;font-size:.8rem;margin-bottom:7px}.advice-grid strong{font-size:.95rem}iframe{width:100%;height:1750px;border:0;background:#0b1220;border-radius:12px}#jgFrame{height:2100px}[hidden]{display:none!important}@media(max-width:650px){.inputs,.advice-grid{grid-template-columns:1fr}iframe{height:2250px}#jgFrame{height:2600px}.head{align-items:stretch}.tabs{width:100%}.tabs button{flex:1}}</style></head><body><header><div class="head"><h1>⚔ LoL Pick Advisor</h1><nav class="tabs" aria-label="ロール切替"><button data-role="top" class="active" aria-selected="true">TOP</button><button data-role="jg" aria-selected="false">JG</button></nav></div></header><main><div id="topArea"><div class="subtabs"><button data-sub="pick" class="active">ピック判定</button><button data-sub="advice">先出し対面攻略</button></div><section id="pickArea"><iframe id="topFrame" title="TOPピック判定" loading="eager"></iframe></section><section id="adviceArea" hidden><div class="panel"><h2>セト・グウェン 先出し対面攻略</h2><p class="muted">相手TOPが後出しされたら選択。ポッピーは後出し専用のため対象外です。</p><div class="inputs"><div><label for="myPick">自分のチャンピオン</label><select id="myPick"><option>セト</option><option>グウェン</option></select></div><div><label for="adviceEnemy">相手TOP</label><input id="adviceSearch" placeholder="名前で絞り込み"><select id="adviceEnemy" style="margin-top:8px"></select></div></div><div id="adviceResult" aria-live="polite"></div></div></section></div><div id="jgArea" hidden><div class="subtabs"><button data-jgsub="pick" class="active">ピック判定</button><button data-jgsub="early">序盤対面攻略</button></div><section id="jgPickArea"><iframe id="jgFrame" title="JGピック判定" loading="eager"></iframe></section><section id="jgEarlyArea" hidden><div class="panel"><h2>JG 序盤対面攻略</h2><p class="muted">Lv3・Lv6の1対1、侵入リスク、重要スキルと対応策を確認。評価は同程度のHP・装備、味方介入なしの目安です。</p><div class="inputs"><div><label for="jgMy">自分のJG</label><select id="jgMy"></select></div><div><label for="jgEnemy">相手のJG</label><input id="jgSearch" placeholder="相手JGを検索"><select id="jgEnemy" style="margin-top:8px"></select></div></div><div id="jgEarlyResult" aria-live="polite"></div></div></section></div><p class="muted">オフライン対応・外部通信なし。判定は定性的な目安であり、最新パッチの勝率を自動反映しません。</p></main><script>const jgHTML="<!doctype html>\n<html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#101827\"><title>LoL JG ピック判定</title>\n<style>\n:root{color-scheme:dark;--bg:#0b1220;--panel:#172236;--border:#30405a;--text:#eaf0fa;--muted:#a7b5c9;--accent:#5dd6ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Noto Sans JP',sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 14px 70px}h1{font-size:1.6rem;margin:0 0 5px}h2{font-size:1.05rem;margin:0 0 12px}.muted{color:var(--muted);font-size:.88rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:18px;margin-top:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;min-height:46px}.opt:has(input:checked){border-color:var(--accent);background:#183a3c}input{accent-color:var(--accent);width:17px;height:17px;flex:none}select,button{background:#23334c;color:var(--text);border:1px solid #52617b;border-radius:9px;padding:10px;font:inherit}select{width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}.barrow{display:grid;grid-template-columns:28px 125px 1fr 54px;align-items:center;gap:8px;margin:11px 0}.bar{height:11px;background:#30405a;border-radius:8px;overflow:hidden}.fill{height:100%;background:#7c91b2;border-radius:8px}.barrow:first-child .fill{background:var(--accent)}.winner{font-size:1.45rem;color:var(--accent);font-weight:750;margin:4px 0 12px}.pill{display:inline-block;background:#233b42;border:1px solid #3b7c6a;border-radius:99px;padding:3px 9px;font-size:.8rem;color:#9ae9c9}.reason{padding-left:20px;margin:8px 0}.reason li{margin:5px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{padding:9px 7px;border-bottom:1px solid var(--border);text-align:center}th:first-child,td:first-child{text-align:left}th{color:#c8d5e8;position:sticky;top:0;background:var(--panel)}.scroll{overflow-x:auto}.good{color:#73dfb4;font-weight:700}.bad{color:#f49b9b}.hint{font-size:.82rem;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.wrap{padding:14px 10px 50px}.panel{padding:14px}.barrow{grid-template-columns:22px 105px 1fr 45px;font-size:.85rem}table{min-width:610px}h1{font-size:1.35rem}}\n</style></head><body><main class=\"wrap\"><header><h1>⚔ LoL JG ピック判定</h1><div class=\"muted\">フィドル / グウェン / キンドレッド / イブリン / レク＝サイ · オフライン対応</div></header>\n<div class=\"grid\"><section class=\"panel\"><h2>敵構成</h2><div id=\"enemy\" class=\"options\"></div></section><section class=\"panel\"><h2>味方構成</h2><div id=\"ally\" class=\"options\"></div></section></div>\n<section class=\"panel\"><h2>敵ジャングラーの特徴</h2><select id=\"jg\"></select><p class=\"hint\">具体的な対面が不明な場合は「不明」を選択。タイプ分類は目安です。</p></section>\n<section class=\"panel\" aria-live=\"polite\"><span class=\"pill\">ドラフト適性ランキング</span><div id=\"result\"></div><div class=\"actions\"><button id=\"reset\">すべてリセット</button><button id=\"copy\">判定結果をコピー</button></div><p class=\"hint\">独自の定性的スコアで、勝率予測ではありません。敵構成の各条件は重み2、味方構成は1.5、敵JGの補正を加算します。未選択は中立です。矛盾する条件は同時に選ばないでください。</p></section>\n<section class=\"panel\"><h2>条件別の基本判定表</h2><div class=\"actions\"><button id=\"showEnemy\">敵構成</button><button id=\"showAlly\">味方構成</button></div><div class=\"scroll\"><table><thead><tr><th>判断条件</th><th>フィドル</th><th>グウェン</th><th>キンド</th><th>イブリン</th><th>レクサイ</th></tr></thead><tbody id=\"matrix\"></tbody></table></div><p class=\"hint\">◎ 非常に適する / ○ 適する / △ 条件次第 / × 避けたい。各条件を単独で評価した表です。</p></section>\n<footer class=\"muted\" style=\"margin-top:18px\">データは端末内のみで処理され、外部通信しません。判定表は前回のチャットの定性評価を引き継いでいます。</footer></main>\n<script>\n'use strict';\nconst names=['フィドルスティックス','グウェン','キンドレッド','イブリン','レク＝サイ'];\nconst rows=[\n{g:'enemy',n:'タンク・高HPが多い',v:[1,3,2,0,1]},\n{g:'enemy',n:'柔らかい後衛が多い',v:[2,0,2,3,3]},\n{g:'enemy',n:'近接・短射程が多い',v:[3,3,3,1,2]},\n{g:'enemy',n:'長射程・ポークが多い',v:[0,0,1,2,2]},\n{g:'enemy',n:'ダイブ・突入が多い',v:[3,2,3,1,2]},\n{g:'enemy',n:'CC・妨害が多い',v:[0,1,1,0,1]},\n{g:'enemy',n:'機動力が低い',v:[3,3,2,3,3]},\n{g:'enemy',n:'回復・サステインが多い',v:[2,3,2,1,2]},\n{g:'ally',n:'APダメージ過多',v:[0,0,3,0,3]},\n{g:'ally',n:'ADダメージ過多',v:[3,3,0,3,0]},\n{g:'ally',n:'前衛・CCが豊富',v:[3,3,3,2,2]},\n{g:'ally',n:'前衛が不足',v:[1,1,0,0,2]},\n{g:'ally',n:'序盤の主導権が強い',v:[2,2,3,2,3]},\n{g:'ally',n:'序盤の主導権が弱い',v:[1,1,0,1,1]},\n{g:'ally',n:'味方のCCが少ない',v:[2,0,0,1,3]},\n{g:'ally',n:'集団戦重視',v:[3,3,3,1,1]},\n{g:'ally',n:'スプリット・ピック重視',v:[1,2,2,3,2]}\n];\nconst junglers=[{n:'不明',v:[0,0,0,0,0]},{n:'序盤の侵入・1対1が強い',v:[-2,-1,0,-2,2]},{n:'タンク・エンゲージ型',v:[2,3,1,-1,1]},{n:'ファーム・スケーリング型',v:[1,1,2,1,2]},{n:'アサシン・バースト型',v:[1,0,1,0,1]}];\nconst roles=['範囲CC・集団戦','対タンク・継続火力','AD継続火力・小規模戦','暗殺・ピック','序盤ガンク・ADファイター'];\nconst $=id=>document.getElementById(id);const selected=new Set();let lastText='';\nrows.forEach((r,i)=>{const l=document.createElement('label');l.className='opt';const input=document.createElement('input');input.type='checkbox';input.addEventListener('change',()=>{input.checked?selected.add(i):selected.delete(i);render()});l.append(input,document.createTextNode(r.n));$(r.g).append(l)});\njunglers.forEach((j,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=j.n;$('jg').append(o)});$('jg').addEventListener('change',render);\nfunction compute(){const j=junglers[Number($('jg').value)];return names.map((n,i)=>({n,i,s:[...selected].reduce((sum,k)=>sum+(rows[k].v[i]-1.5)*(rows[k].g==='enemy'?2:1.5),0)+j.v[i]})).sort((a,b)=>b.s-a.s||a.i-b.i)}\nfunction render(){const ranking=compute(),active=selected.size>0||Number($('jg').value)!==0;const out=$('result');out.replaceChildren();if(!active){const p=document.createElement('p');p.className='muted';p.textContent='条件を選択すると、5体の推奨順位と根拠を表示します。';out.append(p);lastText='条件未選択';return}\nconst w=document.createElement('div');w.className='winner';w.textContent='第1候補：'+ranking[0].n;out.append(w);const sub=document.createElement('p');sub.className='muted';sub.textContent='次点：'+ranking[1].n+' ／ '+roles[ranking[0].i];out.append(sub);\nconst min=Math.min(...ranking.map(x=>x.s)),max=Math.max(...ranking.map(x=>x.s));ranking.forEach((r,k)=>{const line=document.createElement('div');line.className='barrow';const rank=document.createElement('span');rank.textContent=String(k+1);const name=document.createElement('span');name.textContent=r.n;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(max===min?65:Math.max(8,15+(r.s-min)/(max-min)*85))+'%';bar.append(fill);const score=document.createElement('span');score.textContent=(r.s>0?'+':'')+Number(r.s.toFixed(2));line.append(rank,name,bar,score);out.append(line)});\nconst heading=document.createElement('h2');heading.textContent='第1候補の判定根拠';heading.style.marginTop='20px';out.append(heading);const list=document.createElement('ul');list.className='reason';const contributions=[...selected].map(k=>({label:(rows[k].g==='enemy'?'敵：':'味方：')+rows[k].n,score:(rows[k].v[ranking[0].i]-1.5)*(rows[k].g==='enemy'?2:1.5)})).sort((a,b)=>b.score-a.score);const good=contributions.filter(x=>x.score>0).slice(0,3),bad=contributions.filter(x=>x.score<0).sort((a,b)=>a.score-b.score).slice(0,2);[...good.map(x=>'有利：'+x.label),...bad.map(x=>'注意：'+x.label)].forEach(s=>{const li=document.createElement('li');li.textContent=s;list.append(li)});if(!list.children.length){const li=document.createElement('li');li.textContent='選択条件による強い有利・不利はありません。';list.append(li)}out.append(list);\nlastText='LoL JG ピック判定\\n'+ranking.map((r,i)=>`${i+1}. ${r.n} (${r.s.toFixed(2)}点)`).join('\\n')+'\\n敵JG：'+junglers[Number($('jg').value)].n+'\\n条件：'+[...selected].map(k=>rows[k].n).join('、')}\nfunction table(group){const body=$('matrix');body.replaceChildren();const sym=['×','△','○','◎'];rows.filter(r=>r.g===group).forEach(r=>{const tr=document.createElement('tr');const label=document.createElement('td');label.textContent=r.n;tr.append(label);r.v.forEach(v=>{const td=document.createElement('td');td.textContent=sym[v];td.className=v===3?'good':v===0?'bad':'';tr.append(td)});body.append(tr)})}\n$('showEnemy').addEventListener('click',()=>table('enemy'));$('showAlly').addEventListener('click',()=>table('ally'));$('reset').addEventListener('click',()=>{selected.clear();document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);$('jg').value='0';render()});$('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(lastText)}else{const t=document.createElement('textarea');t.value=lastText;document.body.append(t);t.select();document.execCommand('copy');t.remove()}$('copy').textContent='コピーしました';setTimeout(()=>$('copy').textContent='判定結果をコピー',1800)}catch(e){alert('コピーできませんでした。ブラウザの権限を確認してください。')}});table('enemy');render();\n<\/script></body></html>\n";const topHTML="<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#111827\"><title>LoL TOP ピック判定</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8edf5}main{max-width:920px;margin:auto;padding:18px}h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.05rem}p,small{color:#aebbd0}section{background:#162133;border:1px solid #2b3c53;border-radius:15px;padding:17px;margin:14px 0}input,select,button{font:inherit;background:#0c1728;color:#fff;border:1px solid #41516a;border-radius:9px;padding:11px;max-width:100%}input{width:100%}button{cursor:pointer}button.active{background:#235d73;border-color:#5fc5e5}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pick{border:1px solid #344861;border-radius:12px;padding:12px 6px;text-align:center;background:#0f1b2b}.pick strong{display:block;font-size:1rem}.pick em{display:block;font-size:1.5rem;font-style:normal;margin:7px 0}.best{border-color:#53d8a1;background:#12352e}.good{color:#69e5af}.bad{color:#ff8b8b}.muted{color:#9caec4}.label{font-size:.8rem;color:#9fb1c9}.tip{border-left:3px solid #51a9c9;padding:8px 12px;background:#10273b;margin:12px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid #304056;padding:9px 7px;text-align:center}th:first-child,td:first-child{text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#162133}tr{cursor:pointer}tr:hover{background:#24364d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar select{flex:1}footer{padding:10px 0 30px;color:#8c9bb0;font-size:.8rem}@media(max-width:600px){main{padding:11px}section{padding:12px}.grid{gap:4px}.pick{padding:9px 2px}.pick strong{font-size:.74rem}.pick em{font-size:1.2rem}h1{font-size:1.25rem}th,td{padding:8px 5px}}</style></head><body><main><h1>⚔ LoL TOP ピック判定</h1><p>セト・ポッピー・グウェン ＋ レンジ対策のナサス・オラフ。対面TOPを選んで即判断。</p><section><h2>① 敵TOPを選択</h2><input id=\"search\" placeholder=\"チャンピオン名を検索（例：カミール、ヴェイン）\" autocomplete=\"off\"><div class=\"toolbar\" style=\"margin-top:10px\"><select id=\"enemy\" aria-label=\"敵TOP\"></select><button id=\"clear\">リセット</button></div><div id=\"type\" class=\"label\" style=\"margin-top:12px\"></div></section><section id=\"result\"><h2>② おすすめピック</h2><div id=\"ranking\" class=\"grid\"></div><div id=\"reason\" class=\"tip\"></div><p id=\"note\"></p></section><section><h2>③ 味方構成で微調整</h2><p>対面相性を最優先しつつ、ダメージ構成と前衛不足を軽く加味します。</p><div class=\"chips\" id=\"adjust\"><button data-a=\"none\" class=\"active\">指定なし</button><button data-a=\"ad\">味方AD過多</button><button data-a=\"ap\">味方AP過多</button><button data-a=\"tank\">味方に前衛なし</button></div><small>補正は控えめです。対面の厳しさを無視してAP/ADだけで選ばないでください。</small></section><section><h2>④ カウンター一覧</h2><div class=\"toolbar\"><select id=\"filter\"><option value=\"all\">全対面</option><option value=\"ranged\">レンジTOPのみ</option><option value=\" function populateJg(){jgNames.forEach(n=>{const o=document.createElement('option');o.textContent=n;o.value=n;$('jgMy').append(o)});$('jgMy').value='フィドル';const fill=()=>{const q=$('jgSearch').value.trim(),old=$('jgEnemy').value;$('jgEnemy').replaceChildren();jgEnemies.filter(n=>n.includes(q)).sort((a,b)=>a.localeCompare(b,'ja')).forEach(n=>{const o=document.createElement('option');o.textContent=n;o.value=n;$('jgEnemy').append(o)});if([...$('jgEnemy').options].some(o=>o.value===old))$('jgEnemy').value=old;renderJgEarly()};$('jgSearch').oninput=fill;$('jgMy').onchange=renderJgEarly;$('jgEnemy').onchange=renderJgEarly;document.querySelectorAll('[data-jgsub]').forEach(b=>b.onclick=()=>{jgSub=b.dataset.jgsub;renderJgSub()});fill();renderJgSub()}

const $=id=>document.getElementById(id);let role='top';let sub='pick';
function renderTabs(){document.querySelectorAll('[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.setAttribute('aria-selected',String(b.dataset.role===role))});$('topArea').hidden=role!=='top';$('jgArea').hidden=role!=='jg';}
function renderSub(){document.querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('active',b.dataset.sub===sub));$('pickArea').hidden=sub!=='pick';$('adviceArea').hidden=sub!=='advice';}
function renderAdvice(){const who=$('myPick').value,enemy=$('adviceEnemy').value;const d=advice[enemy]?.[who];$('adviceResult').innerHTML=d?`<div class="advice-grid"><article><span>警戒スキル</span><strong>${d.danger}</strong></article><article><span>さばき方</span><strong>${d.response}</strong></article><article><span>トレード</span><strong>${d.trade}</strong></article><article><span>勝負タイミング</span><strong>${d.timing}</strong></article></div><p class="muted">勝負タイミングは確定有利を保証しません。HP・装備・ウェーブ・敵JG位置を優先してください。</p>`:'<p>この対面の詳細はまだ未収録です。ピック判定タブの基本Tipsを確認してください。</p>';}
window.addEventListener('DOMContentLoaded',()=>{$('topFrame').srcdoc=topHTML;$('jgFrame').srcdoc=jgHTML;Object.keys(advice).sort((a,b)=>a.localeCompare(b,'ja')).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;$('adviceEnemy').append(o)});$('adviceEnemy').value='ボリベア';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;renderTabs()});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;renderSub()});$('myPick').onchange=renderAdvice;$('adviceEnemy').onchange=renderAdvice;$('adviceSearch').oninput=()=>{const q=$('adviceSearch').value.trim();const old=$('adviceEnemy').value;$('adviceEnemy').replaceChildren();Object.keys(advice).filter(n=>n.includes(q)).sort((a,b)=>a.localeCompare(b,'ja')).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;$('adviceEnemy').append(o)});if([...$('adviceEnemy').options].some(o=>o.value===old))$('adviceEnemy').value=old;renderAdvice()};renderTabs();renderSub();renderAdvice();populateJg()});</script></body></html>
